[package]
name = "skey-core"
version = "0.1.0"
edition = "2021"
description = "Vietnamese input method engine for SKey"
license = "GPL-2.0-or-later"

[lib]
name = "skey_core"

[dependencies]
# Optional, for front ends that keep their configuration in JSON, TOML or
# YAML: Tauri, Slint, Iced, or anything on WASM.
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
# Only used by the serde round trip test, which is itself cfg gated.
serde_json = "1"

[features]
default = ["testkit", "alloc"]
alloc = []
testkit = ["alloc"]
serde = ["dep:serde"]
large-macro-table = []
