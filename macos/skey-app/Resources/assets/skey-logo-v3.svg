<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="#000000"/>

  <!-- Minimal Keyboard Key Border -->
  <rect x="80" y="80" width="352" height="352" rx="72" fill="#14151A" stroke="#262833" stroke-width="6"/>

  <!-- Pure Geometric Typographic S -->
  <text x="256" y="325" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" 
        font-size="240" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#FFFFFF">S</text>

  <!-- Electric Cyan Keystroke Indicator Accent -->
  <circle cx="370" cy="142" r="14" fill="#0A84FF"/>
</svg>
