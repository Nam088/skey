name: Release - Windows

on:
  push:
    branches: [main]
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - both
      version_bump:
        description: 'Version Bump Type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release Windows
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'both'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core (skey.lib)
        shell: bash
        env:
          # Static CRT: shipped exes must not require the VC++ redistributable.
          # staticlib only: a plain cargo build also emits the cdylib
          # import library, which overwrites skey.lib and makes every exe
          # import skey.dll (STATUS_DLL_NOT_FOUND at startup).
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cd core
          cargo rustc --release -p skey-capi --target x86_64-pc-windows-msvc --crate-type staticlib

      - name: Auto Tag
        id: auto_tag
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'win-v*' --sort=-version:refname | head -1 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            VERSION="${LATEST_TAG#win-v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            MAJOR="${MAJOR:-1}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="${{ github.event.inputs.version_bump }}"
          else
            BUMP_TYPE="patch"
          fi

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="win-v${MAJOR}.${MINOR}.${PATCH}"
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            NEW_TAG="win-v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "New tag: $NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release Windows $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Determine Version
        id: release_meta
        shell: bash
        run: |
          if [ -n "${{ steps.auto_tag.outputs.new_tag }}" ]; then
            TAG="${{ steps.auto_tag.outputs.new_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/win-v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(git tag -l 'win-v*' --sort=-version:refname | head -1)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#win-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure
        run: cmake -S platforms/windows/build-config -B out/windows-contract -DSKEY_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build out/windows-contract --config Release

      - name: Package
        run: cmake --build out/windows-contract --config Release --target skey-package

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2

      - name: Build MSI Installer
        shell: bash
        run: |
          cd installer-windows
          cp ../out/windows-contract/installer-windows/package/skey-tray.exe .
          cp ../out/windows-contract/installer-windows/package/skey-tsf.dll .
          wix build SKeyInstaller.wxs -o SKey-Installer.msi -arch x64

      - name: Generate checksums
        shell: bash
        run: |
          cd out/windows-contract/installer-windows
          if command -v certutil &> /dev/null; then
            certutil -hashfile skey-windows.zip SHA256 > SHA256SUMS.txt
            cd ../../../installer-windows
            certutil -hashfile SKey-Installer.msi SHA256 >> ../out/windows-contract/installer-windows/SHA256SUMS.txt
          else
            sha256sum skey-windows.zip > SHA256SUMS.txt
            sha256sum ../../../installer-windows/SKey-Installer.msi >> SHA256SUMS.txt
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SKey-Windows-${{ steps.release_meta.outputs.version }}
          path: |
            out/windows-contract/installer-windows/skey-windows.zip
            installer-windows/SKey-Installer.msi
            out/windows-contract/installer-windows/SHA256SUMS.txt

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          VERSION="${{ steps.release_meta.outputs.version }}"
          echo "## SKey Windows v${VERSION}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Changes" >> RELEASE_NOTES.md
          PREV_TAG=$(git tag -l 'win-v*' --sort=-version:refname | sed -n '2p' 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> RELEASE_NOTES.md 2>/dev/null || echo "- Initial release" >> RELEASE_NOTES.md
          else
            echo "- Initial release" >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Checksums" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          cat out/windows-contract/installer-windows/SHA256SUMS.txt >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: SKey Windows ${{ steps.release_meta.outputs.tag }}
          files: |
            installer-windows/SKey-Installer.msi
            out/windows-contract/installer-windows/skey-windows.zip
            out/windows-contract/installer-windows/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
