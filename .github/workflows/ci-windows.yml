name: CI - Windows

on:
  push:
    branches: [main, windows-ime]
    paths:
      - 'platforms/windows/**'
      - 'shared/**'
      - 'core/**'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'platforms/windows/**'
      - 'shared/**'
      - 'core/**'
      - '.github/workflows/ci-windows.yml'

jobs:
  contracts:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config core.protectNTFS false
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git archive FETCH_HEAD .github platforms/windows installer-windows core shared | tar -xf -

      - name: Validate contracts
        shell: bash
        run: python3 platforms/windows/build-config/validate_contracts.py

      - name: Validate package
        shell: bash
        run: python3 platforms/windows/build-config/validate_package.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core (skey.lib)
        shell: bash
        env:
          # Static CRT so exes do not require VCRUNTIME140.dll (headless
          # runners lack the redistributable). --crate-type staticlib only:
          # a plain `cargo build` also emits the cdylib import library,
          # which overwrites skey.lib and makes every exe import skey.dll
          # (STATUS_DLL_NOT_FOUND at startup).
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cd core
          cargo rustc --release -p skey-capi --target x86_64-pc-windows-msvc --crate-type staticlib

      - name: Configure
        run: cmake -S platforms/windows/build-config -B out/windows-contract -DSKEY_BUILD_TESTS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build out/windows-contract --config Release

      - name: Test
        run: ctest --test-dir out/windows-contract -C Release --output-on-failure

      - name: Package
        run: cmake --build out/windows-contract --config Release --target skey-package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skey-windows-package
          path: out/windows-contract/installer-windows/skey-windows.zip

  settings-ui:
    name: Settings UI (WinUI 3)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: nuget/setup-nuget@v2

      - uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore platforms/windows/skey-settings/SKey.Settings.sln

      - name: Build
        # Discover the newest installed PlatformToolset (e.g. v145 under the
        # v180 VC targets dir): guessing from the targets dir name yields
        # MSB8020, and an unset toolset falls back to v100. The project declares
        # ApplicationType "Windows Store", so the toolset must exist under that
        # application type, not just the desktop one.
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcdir = Get-ChildItem "$vs\MSBuild\Microsoft\VC" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $storeToolsets = Join-Path $vcdir.FullName 'Application Type\Windows Store\10.0\Platforms\x64\PlatformToolsets'
          if (-not (Test-Path $storeToolsets)) {
            throw "Missing $storeToolsets - the VS 'Universal Windows Platform tools' C++ component is required to build WinUI 3."
          }
          $toolset = Get-ChildItem $storeToolsets -Directory |
            Where-Object { $_.Name -match '^v\d+$' } |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          Write-Host "Using PlatformToolset=$toolset from $storeToolsets"
          msbuild platforms/windows/skey-settings/SKey.Settings.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:PlatformToolset=$toolset" /m /v:m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skey-settings-winui
          path: platforms/windows/skey-settings/x64/Release/**
          if-no-files-found: warn

  rust:
    name: Rust Core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets
        working-directory: core
