name: Update Homebrew Cask

on:
  workflow_run:
    # Must match `name:` in release-macos.yml exactly. It was renamed to
    # "Release - macOS" and this string was left behind, so the cask silently
    # stopped updating after 2026-08-31 while releases kept shipping.
    workflows: ["Release - macOS"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-cask:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Find Release Assets & Compute Checksum
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          # `gh release view` with no tag returns the newest release of ANY platform, and
          # this repo publishes win-v* into the same repo. Pick the newest mac-v* release by
          # version, not by list position: GitHub does not return releases newest-first.
          TAG=$(gh release list --repo ${{ github.repository }} --limit 50 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '[.[] | select(.isDraft == false and .isPrerelease == false)
                             | select(.tagName | startswith("mac-v")) | .tagName]
                        | sort_by(.[5:] | split(".") | map(tonumber)) | last')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No published mac-v* release found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip the platform prefix: the cask's url interpolates mac-v#{version}.
          VERSION="${TAG#mac-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          DMG_URL=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets --jq '.assets[] | select(.name | endswith(".dmg")) | .url')
          if [ -z "$DMG_URL" ]; then
            echo "::error::No .dmg asset found on $TAG"
            exit 1
          fi

          echo "dmg_url=$DMG_URL" >> "$GITHUB_OUTPUT"
          curl -fL "$DMG_URL" -o SKey-Installer.dmg
          SHA256=$(shasum -a 256 SKey-Installer.dmg | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update Casks/skey.rb
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
          TAG: ${{ steps.asset.outputs.tag }}
        run: |
          sed -i -e "s/^  version \".*\"/  version \"$VERSION\"/" Casks/skey.rb
          sed -i -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/skey.rb
          cat Casks/skey.rb

      - name: Commit and Push Cask Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Casks/skey.rb; then
            echo "Cask already up to date"
            exit 0
          fi
          git add Casks/skey.rb
          git commit -m "chore: bump Homebrew Cask to ${{ steps.asset.outputs.tag }} [skip ci]"
          git push

      - name: Sync to Nam088/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.asset.outputs.tag }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Nam088/homebrew-tap.git" /tmp/tap-sync 2>/dev/null || exit 0
          mkdir -p /tmp/tap-sync/Casks
          cp Casks/skey.rb /tmp/tap-sync/Casks/skey.rb
          cd /tmp/tap-sync
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Casks/skey.rb; then
            git add Casks/skey.rb
            git commit -m "chore: bump skey cask to $TAG"
            git push origin main 2>/dev/null || echo "Note: Push to homebrew-tap skipped (requires repo permissions or HOMEBREW_TAP_TOKEN secret)"
          fi

