name: Release - macOS

on:
  push:
    branches: [main]
    tags:
      - 'mac-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release'
        required: true
        default: 'macos'
        type: choice
        options:
          - macos
          - both
      version_bump:
        description: 'Version Bump Type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release macOS
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'both'
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26 (macOS 26 SDK)
        run: |
          set -euo pipefail
          # Liquid Glass is granted by the SDK an app links against, not by its deployment
          # target, so the whole point of this runner is the macOS 26 SDK. Assert it instead
          # of trusting the image default: a silent drop back to an older Xcode would ship a
          # pre-Liquid-Glass build with a green tick, which is exactly how the previous
          # "minos 26.0, sdk 14.5" binary reached users unnoticed.
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "macOS SDK: ${SDK_VERSION}"
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "::error::Expected macOS SDK 26.x for Liquid Glass, got ${SDK_VERSION}"; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Auto Tag
        id: auto_tag
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'mac-v*' --sort=-version:refname | head -1 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            VERSION="${LATEST_TAG#mac-v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            MAJOR="${MAJOR:-1}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="${{ github.event.inputs.version_bump }}"
          else
            BUMP_TYPE="patch"
          fi

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="mac-v${MAJOR}.${MINOR}.${PATCH}"
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            NEW_TAG="mac-v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "New tag: $NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release macOS $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Determine Version
        id: release_meta
        run: |
          if [ -n "${{ steps.auto_tag.outputs.new_tag }}" ]; then
            TAG="${{ steps.auto_tag.outputs.new_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/mac-v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(git tag -l 'mac-v*' --sort=-version:refname | head -1)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#mac-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release
        env:
          APP_VERSION: ${{ steps.release_meta.outputs.version }}
        run: bash scripts/build_release.sh

      - name: Verify binary target and SDK
        run: |
          # Chạy TRƯỚC mọi bước upload: một bản ship sai minos hoặc sai SDK phải chặn
          # ngay tại đây, không được lên tới GitHub Release rồi mới phát hiện.
          bash scripts/verify_macos_binary.sh \
            dist/SKey.app/Contents/MacOS/SKey 14.0 26 --universal

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SKey-macOS-${{ steps.release_meta.outputs.version }}
          path: |
            dist/SKey-Installer.dmg
            dist/SKey-macOS-Universal.zip
            dist/SHA256SUMS.txt

      - name: Generate Release Notes
        run: |
          bash scripts/generate_release_notes.sh --version "${{ steps.release_meta.outputs.tag }}" --output dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: SKey macOS ${{ steps.release_meta.outputs.tag }}
          files: |
            dist/SKey-Installer.dmg
            dist/SKey-macOS-Universal.zip
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
