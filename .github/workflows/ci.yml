name: ci

on:
  push:
  pull_request:
  schedule:
    # The differential sweep takes minutes, so it runs nightly rather than
    # on every push.
    - cron: '0 18 * * *'

env:
  # Warnings are errors everywhere. Checking that a build printed no
  # warnings does not work: the second invocation is cached and prints
  # nothing at all, so it passes without having looked.
  RUSTFLAGS: -D warnings

jobs:
  fast:
    name: build, tests, portability
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}

      - name: build the workspace
        run: cargo build --release --workspace

      # clippy is deliberately not here yet. Two of its findings are in
      # seq.rs, where the branch chains mirror the order of the branches in
      # getTonePosition and isValidCV so a reviewer can read them against
      # ukengine.cpp; collapsing them would cost more than the lint is
      # worth. Wiring clippy in needs its own pass to write those
      # exemptions with reasons, which is a source change and does not
      # belong in the commit that adds CI.

      - name: unit, golden and size tests
        run: cargo test --release

      # The three build configurations that have to keep working. Without
      # an allocator the engine still supports every input method and all
      # 21 output charsets, which is what a keyboard firmware target needs.
      - name: no allocator at all
        run: |
          cargo build --release -p skey-core --no-default-features
          cargo test --release -p skey-core --no-default-features --test smoke

      - name: webassembly
        run: cargo build --release -p skey-core --target wasm32-unknown-unknown

      - name: serde
        run: cargo test --release -p skey-core --features serde --test smoke

  differential:
    name: differential against the C++ original
    runs-on: ubuntu-latest
    # Not on every push: this builds the 2005 C++ engine and drives
    # millions of key sequences through both it and the port.
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: build the oracle, the port, and both ABI harnesses
        # The legacy C++ oracle predates transitive standard-library includes;
        # provide the missing C string declarations without modifying the
        # reference sources themselves.
        run: make CXXFLAGS='-O1 -std=c++11 -w -Wno-narrowing -D_tempnam=tempnam -include cstring' CXX=g++ oracle rust oracle-rust ctx-harness
        env:
          LEGACY_SRC_DIR: ../archive/unikey-legacy

      - name: the tables still match the C++ binary they came from
        run: |
          make tables
          git diff --exit-code -- skey-core/src/phonetics/tables.rs \
                                  skey-core/src/phonetics/lexi_consts.rs

      - name: exhaustive and random sweep
        run: make sweep

      - name: macro and key map sweeps
        run: make macrosweep keymapsweep

      - name: both C ABIs
        run: make capi-check ctx-check
